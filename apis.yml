aid: materialbank
name: Materialbank
description: 'Material Bank is an e-commerce marketplace that lets architecture and
  design professionals search and order free material samples from thousands of design
  and architectural product brands, delivered overnight in a single box. Founded by
  Adam Sandow, the platform consolidates supplier sample catalogs into one searchable
  storefront (built on Adobe Commerce) with free next-day sample fulfillment. Material
  Bank does not publish a public developer API program: the consumer storefront runs
  a standard Adobe Commerce GraphQL endpoint at /graphql (introspection disabled)
  and an api.materialbank.com host that is not publicly documented.'
